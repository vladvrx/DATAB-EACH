  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  background-color: #020617;

}

  flex-direction: column;

}

.badge-header {

}

}

.power-badge .bar-fill {

}
.power-badge.danger .bar-fill {

}

  constructor(state) {
    this.state = state;
    this.blackoutTimer = 0;
  }

  tick(deltaSeconds) {
    if (this.state.status !== "playing") return;

    this.state.gameTime += deltaSeconds;

    // 1. Update Phases & Escalation
    this.updatePhases();

    // 2. Handle Surge Timing & Fluctuations
    this.updateSurge(deltaSeconds);

    // 3. Calculate Power Grid
    this.updatePowerGrid();

    // 4. Calculate Eco Cleanliness
    this.updateEco(deltaSeconds);

    // 5. Calculate Revenue & Tourist Traffic
    this.updateRevenue(deltaSeconds);

    // 6. Check Win/Loss Conditions
    this.checkEndConditions(deltaSeconds);
  }

  updatePhases() {
    const t = this.state.gameTime;
    if (t < 90) {
      this.state.phase = 1;
      this.state.phaseName = "Phase 1: Sunrise Arrival";
    } else if (t < 210) {
      this.state.phase = 2;
      this.state.phaseName = "Phase 2: High Tide Rush";
    } else if (t < 330) {
      this.state.phase = 3;
      this.state.phaseName = "Phase 3: Signal Surge Storm";
    } else {
      this.state.phase = 4;
      this.state.phaseName = "Phase 4: Neon Sunset Gala";
    }
  }

  updateSurge(deltaSeconds) {
    const s = this.state.surge;
    if (!s.active) {
      s.countdown -= deltaSeconds;
      if (s.countdown <= 0) {
        s.active = true;
        s.remaining = s.duration;
        s.intensity = 0.8;
      }
    } else {
      s.remaining -= deltaSeconds;
      if (s.remaining <= 0) {
        s.active = false;
        s.countdown = 150; // next surge in 2.5 minutes
        s.intensity = 0;
        this.state.stats.surgesSurvived++;
      }
    }
  }

  updatePowerGrid() {
    let gen = 0;
    let draw = 0;

    for (const plot of this.state.plots) {
      if (!plot.building) continue;
      const def = BUILDINGS[plot.building.type];
      if (!def) continue;

      const tier = UPGRADE_TIERS[plot.building.level - 1] || UPGRADE_TIERS[0];
      const mult = tier.multiplier;

      if (def.category === "energy") {
        let pGen = def.powerGen * mult;
        // Surge solar flare / storm effect: wind boosts, solar drops slightly
        if (this.state.surge.active) {
          if (plot.building.type === "solar_canopy") pGen *= 0.65;
          if (plot.building.type === "wind_turbine") pGen *= 1.35;
        }
        gen += pGen;
      } else {
        let pDraw = def.powerDraw;
        if (plot.building.level > 1) {
          pDraw *= (1 + (plot.building.level - 1) * 0.4);
        }
        // Surge increases grid load
        if (this.state.surge.active) {
          pDraw *= 1.3;
        }
        draw += pDraw;
      }
    }

    this.state.powerGen = Math.round(gen);
    this.state.powerDraw = Math.round(draw);

    if (draw <= 0) {
      this.state.powerSatisfaction = 1.0;
    } else if (gen >= draw) {
      this.state.powerSatisfaction = 1.0;
    } else {
      this.state.powerSatisfaction = Math.max(0.1, gen / draw);
    }
  }

  updateEco(deltaSeconds) {
    let deltaEco = 0;
    let totalAttractions = 0;

    for (const plot of this.state.plots) {
      if (!plot.building) continue;
      const def = BUILDINGS[plot.building.type];
      if (!def) continue;

      const tier = UPGRADE_TIERS[plot.building.level - 1] || UPGRADE_TIERS[0];

      if (def.category === "eco") {
        deltaEco += def.ecoImpact * tier.multiplier * 0.15;
      } else if (def.category === "attraction") {
        totalAttractions++;
        deltaEco += def.ecoImpact * (1 + (plot.building.level - 1) * 0.3) * 0.1;
      }
    }

    // Natural mild drift towards 50%
    if (deltaEco === 0) {
      deltaEco = (60 - this.state.ecoHealth) * 0.005;
    }

    // Moderate tourist pollution in later phases
    if (this.state.phase >= 2) {
      deltaEco -= (this.state.touristCount * 0.015);
    }

    this.state.ecoHealth = Math.min(100, Math.max(0, this.state.ecoHealth + deltaEco * deltaSeconds));
  }

  updateRevenue(deltaSeconds) {
    let baseIncomeRate = 0;
    let attractionCount = 0;

    for (const plot of this.state.plots) {
      if (!plot.building) continue;
      const def = BUILDINGS[plot.building.type];
      if (!def) continue;

      if (def.category === "attraction" || def.baseRevenue > 0) {
        attractionCount++;
        const tier = UPGRADE_TIERS[plot.building.level - 1] || UPGRADE_TIERS[0];
        baseIncomeRate += def.baseRevenue * tier.multiplier;
      }
    }

    // Satisfaction factors
    const powerFactor = Math.pow(this.state.powerSatisfaction, 1.2);
    const ecoFactor = 0.4 + (this.state.ecoHealth / 100) * 0.6;
    const effectiveIncomeRate = baseIncomeRate * powerFactor * ecoFactor;

    const earned = effectiveIncomeRate * deltaSeconds;
    this.state.databloons += earned;
    this.state.lifetimeEarned += earned;
    this.state.incomeRate = Math.round(effectiveIncomeRate);

    // Tourist population & Resort Rating
    const targetTourists = Math.min(25, 3 + attractionCount * 3 + Math.floor(this.state.ecoHealth / 15));
    this.state.touristCount = Math.round(targetTourists * powerFactor);

    // Calculate dynamic rating (1.0 to 5.0)
    const powerScore = this.state.powerSatisfaction * 2.0;
    const ecoScore = (this.state.ecoHealth / 100) * 2.0;
    const varietyScore = Math.min(1.0, attractionCount / 5);
    this.state.resortRating = Math.min(5.0, Math.max(1.0, Number((powerScore + ecoScore + varietyScore).toFixed(1))));
  }

  checkEndConditions(deltaSeconds) {
    // 1. Blackout Failure (power satisfaction < 0.2 for 20 seconds)
    if (this.state.powerSatisfaction < 0.25 && this.state.powerDraw > 15) {
      this.blackoutTimer += deltaSeconds;
      if (this.blackoutTimer >= 18) {
        this.state.status = "game_over";
        this.state.statusMessage = "CRITICAL GRID FAILURE: Island-wide blackout caused resort evacuation.";
        return;
      }
    } else {
      this.blackoutTimer = Math.max(0, this.blackoutTimer - deltaSeconds * 2);
    }

    // 2. Eco Collapse Failure
    if (this.state.ecoHealth <= 1) {
      this.state.status = "game_over";
      this.state.statusMessage = "ECOLOGICAL COLLAPSE: Bio-waste exceeded safe parameters. Island quarantined.";
      return;
    }

    // 3. Victory Condition
    // Earn $60,000+ total, reach 4.8+ rating, keep eco >= 75%, and reach at least Phase 3
    if (
      this.state.lifetimeEarned >= this.state.targetWinScore &&
      this.state.resortRating >= this.state.targetWinRating &&
      this.state.ecoHealth >= 75
    ) {
      this.state.status = "victory";
      this.state.statusMessage = "5-STAR PARADISE ACHIEVED! Data B-each is now the premier alien eco-resort in the galaxy!";
    }
  }

  // --- ACTIONS ---

  canBuild(buildingType, plotId) {
    const plot = this.state.plots[plotId];
    if (!plot || plot.building) return false;
    const def = BUILDINGS[buildingType];
    if (!def) return false;
    return this.state.databloons >= def.baseCost;
  }

  build(buildingType, plotId) {
    if (!this.canBuild(buildingType, plotId)) return false;
    const def = BUILDINGS[buildingType];
    this.state.databloons -= def.baseCost;
    this.state.plots[plotId].building = {
      type: buildingType,
      level: 1,
      constructedAt: this.state.gameTime
    };
    this.state.stats.buildingsPlaced++;
    this.updatePowerGrid();
    return true;
  }

  getUpgradeCost(plotId) {
    const plot = this.state.plots[plotId];
    if (!plot || !plot.building) return null;
    if (plot.building.level >= UPGRADE_TIERS.length) return null;

    const def = BUILDINGS[plot.building.type];
    const nextTier = UPGRADE_TIERS[plot.building.level];
    return Math.round(def.baseCost * nextTier.costFactor);
  }

  canUpgrade(plotId) {
    const cost = this.getUpgradeCost(plotId);
    return cost !== null && this.state.databloons >= cost;
  }

  upgrade(plotId) {
    if (!this.canUpgrade(plotId)) return false;
    const cost = this.getUpgradeCost(plotId);
    this.state.databloons -= cost;
    this.state.plots[plotId].building.level++;
    this.state.stats.upgradesPerformed++;
    this.updatePowerGrid();
    return true;
  }

  demolish(plotId) {
    const plot = this.state.plots[plotId];
    if (!plot || !plot.building) return false;
    const def = BUILDINGS[plot.building.type];
    // Refund 40%
    const refund = Math.round(def.baseCost * 0.4);
    this.state.databloons += refund;
    plot.building = null;
    this.updatePowerGrid();
    return true;
  }

  cleanTrash() {
    this.state.ecoHealth = Math.min(100, this.state.ecoHealth + 4);
    this.state.databloons += 50;
    this.state.stats.trashesCleaned++;
    return true;
  }
}


// --- AUDIO SYNTHESIZER ---
class SoundFX {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }

  ensureContext() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        this.ctx = new AudioContext();
      }
    }
    if (this.ctx && this.ctx.state === "suspended") {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    return this.muted;
  }

  playClick() {
    if (this.muted) return;
    this.ensureContext();
    if (!this.ctx) return;

    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const now = this.ctx.currentTime;

    osc.type = "sine";
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);

    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

    osc.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(now);
    osc.stop(now + 0.05);
  }

  playBuild() {
    if (this.muted) return;
    this.ensureContext();
    if (!this.ctx) return;

    const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
    notes.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const startTime = this.ctx.currentTime + i * 0.06;

      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, startTime);

      gain.gain.setValueAtTime(0.25, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.15);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(startTime);
      osc.stop(startTime + 0.15);
    });
  }

  playUpgrade() {
    if (this.muted) return;
    this.ensureContext();
    if (!this.ctx) return;

    const notes = [392.00, 523.25, 659.25, 783.99, 1046.50]; // G4, C5, E5, G5, C6
    notes.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const startTime = this.ctx.currentTime + i * 0.05;

      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, startTime);

      gain.gain.setValueAtTime(0.2, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(startTime);
      osc.stop(startTime + 0.2);
    });
  }

  playCash() {
    if (this.muted) return;
    this.ensureContext();
    if (!this.ctx) return;

    const now = this.ctx.currentTime;
    [987.77, 1318.51].forEach((freq, i) => { // B5, E6
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const st = now + i * 0.08;

      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, st);

      gain.gain.setValueAtTime(0.2, st);
      gain.gain.exponentialRampToValueAtTime(0.001, st + 0.18);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(st);
      osc.stop(st + 0.18);
    });
  }

  playTrashClean() {
    if (this.muted) return;
    this.ensureContext();
    if (!this.ctx) return;

    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = "triangle";
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);

    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

    osc.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(now);
    osc.stop(now + 0.08);
  }

  playSurgeWarning() {
    if (this.muted) return;
    this.ensureContext();
    if (!this.ctx) return;

    const now = this.ctx.currentTime;
    for (let i = 0; i < 3; i++) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const st = now + i * 0.25;

      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(320, st);
      osc.frequency.linearRampToValueAtTime(480, st + 0.15);

      gain.gain.setValueAtTime(0.15, st);
      gain.gain.exponentialRampToValueAtTime(0.001, st + 0.2);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(st);
      osc.stop(st + 0.2);
    }
  }

  playVictory() {
    if (this.muted) return;
    this.ensureContext();
    if (!this.ctx) return;

    const fanfare = [
      { f: 523.25, d: 0.15 }, // C5
      { f: 523.25, d: 0.15 }, // C5
      { f: 523.25, d: 0.15 }, // C5
      { f: 659.25, d: 0.4 },  // E5
      { f: 587.33, d: 0.15 }, // D5
      { f: 659.25, d: 0.15 }, // E5
      { f: 783.99, d: 0.6 }   // G5
    ];

    let t = this.ctx.currentTime;
    fanfare.forEach((n) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(n.f, t);

      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + n.d);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(t);
      osc.stop(t + n.d);

      t += n.d + 0.05;
    });
  }

  playGameOver() {
    if (this.muted) return;
    this.ensureContext();
    if (!this.ctx) return;

    const notes = [392.00, 369.99, 349.23, 311.13]; // G4, F#4, F4, D#4
    let t = this.ctx.currentTime;
    notes.forEach((freq) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freq, t);

      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(t);
      osc.stop(t + 0.35);
      t += 0.3;
    });
  }
}


// --- THREE.JS SCENE RENDERER ---




class BeachScene {
  constructor(container, onPlotSelected, onTrashCleaned) {
    this.container = container;
    this.onPlotSelected = onPlotSelected;
    this.onTrashCleaned = onTrashCleaned;

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color("#4ac6ff"); // Bright tropical sky
    this.scene.fog = new THREE.FogExp2("#57d2ff", 0.025);

    this.width = container.clientWidth || 390;
    this.height = container.clientHeight || 500;

    // Portrait diorama camera
    this.camera = new THREE.PerspectiveCamera(48, this.width / this.height, 0.5, 100);
    this.camera.position.set(0, 16, 17);
    this.camera.lookAt(0, -0.5, 0.5);

    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.setSize(this.width, this.height);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(this.renderer.domElement);

    // Setup loaders with Draco support
    this.dracoLoader = new DRACOLoader();
    this.dracoLoader.setDecoderPath("./vendor/draco/");
    this.gltfLoader = new GLTFLoader();
    this.gltfLoader.setDRACOLoader(this.dracoLoader);

    this.modelCache = new Map();
    this.plotMeshes = new Map();
    this.buildingMeshes = new Map();
    this.trashMeshes = [];
    this.floatingTexts = [];

    this.selectedPlotId = null;
    this.raycaster = new THREE.Raycaster();
    this.pointer = new THREE.Vector2();

    this.setupLighting();
    this.setupEnvironment();
    this.setupInteraction();

    window.addEventListener("resize", () => this.onResize());
  }

  setupLighting() {
    const ambient = new THREE.AmbientLight("#e0f4ff", 1.4);
    this.scene.add(ambient);

    const hemi = new THREE.HemisphereLight("#ffe8c4", "#307a8c", 0.9);
    hemi.position.set(0, 20, 0);
    this.scene.add(hemi);

    const sun = new THREE.DirectionalLight("#fff5db", 2.0);
    sun.position.set(12, 22, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    sun.shadow.camera.near = 5;
    sun.shadow.camera.far = 45;
    const d = 14;
    sun.shadow.camera.left = -d;
    sun.shadow.camera.right = d;
    sun.shadow.camera.top = d;
    sun.shadow.camera.bottom = -d;
    sun.shadow.bias = -0.0005;
    this.scene.add(sun);
    this.sunLight = sun;
  }

  setupEnvironment() {
    // Ocean plane
    const oceanGeo = new THREE.PlaneGeometry(80, 80, 24, 24);
    const oceanMat = new THREE.MeshStandardMaterial({
      color: "#0888a8",
      roughness: 0.1,
      metalness: 0.2,
      flatShading: true
    });
    this.ocean = new THREE.Mesh(oceanGeo, oceanMat);
    this.ocean.rotation.x = -Math.PI / 2;
    this.ocean.position.y = -0.6;
    this.scene.add(this.ocean);

    // Island Sand Mass (Main resort beach ground)
    const islandGeo = new THREE.CylinderGeometry(11.5, 13.5, 1.2, 32);
    const islandMat = new THREE.MeshStandardMaterial({
      color: "#f6d89b", // warm golden sand
      roughness: 0.8,
      metalness: 0.05
    });
    const island = new THREE.Mesh(islandGeo, islandMat);
    island.position.y = -0.55;
    island.receiveShadow = true;
    this.scene.add(island);

    // Raised inland ridge for power canopy
    const ridgeGeo = new THREE.BoxGeometry(16, 0.4, 3.8);
    const ridgeMat = new THREE.MeshStandardMaterial({
      color: "#e2bf7d",
      roughness: 0.9
    });
    const ridge = new THREE.Mesh(ridgeGeo, ridgeMat);
    ridge.position.set(0, 0.15, -3.5);
    ridge.receiveShadow = true;
    this.scene.add(ridge);

    // Boardwalk strip
    const boardwalkGeo = new THREE.BoxGeometry(16, 0.08, 1.2);
    const boardwalkMat = new THREE.MeshStandardMaterial({
      color: "#a37042",
      roughness: 0.7
    });
    const boardwalk = new THREE.Mesh(boardwalkGeo, boardwalkMat);
    boardwalk.position.set(0, 0.05, 1.0);
    boardwalk.receiveShadow = true;
    this.scene.add(boardwalk);
  }

  setupPlots(plots) {
    plots.forEach((p) => {
      const plotGroup = new THREE.Group();
      plotGroup.position.set(p.x, 0.04, p.z);

      // Base tile
      const radius = p.type === "sand" ? 1.4 : 1.3;
      const tileGeo = new THREE.CylinderGeometry(radius, radius, 0.08, 16);
      const tileMat = new THREE.MeshStandardMaterial({
        color: p.type === "sand" ? "#ebd094" : p.type === "boardwalk" ? "#c98f59" : "#d1aa64",
        roughness: 0.6
      });
      const tileMesh = new THREE.Mesh(tileGeo, tileMat);
      tileMesh.receiveShadow = true;
      tileMesh.userData = { isPlot: true, plotId: p.id };
      plotGroup.add(tileMesh);

      // Selection Ring
      const ringGeo = new THREE.RingGeometry(radius + 0.05, radius + 0.25, 32);
      const ringMat = new THREE.MeshBasicMaterial({
        color: "#00f0ff",
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.06;
      plotGroup.add(ring);

      this.scene.add(plotGroup);
      this.plotMeshes.set(p.id, { group: plotGroup, tile: tileMesh, ring });
    });
  }

  selectPlot(plotId) {
    this.selectedPlotId = plotId;
    this.plotMeshes.forEach((meshObj, id) => {
      meshObj.ring.material.opacity = id === plotId ? 0.9 : 0;
      meshObj.ring.material.color.set(id === plotId ? "#00f0ff" : "#ffffff");
    });
  }

  async loadModel(url) {
    if (this.modelCache.has(url)) {
      return this.modelCache.get(url).clone();
    }
    return new Promise((resolve, reject) => {
      this.gltfLoader.load(
        url,
        (gltf) => {
          const model = gltf.scene;
          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          this.modelCache.set(url, model);
          resolve(model.clone());
        },
        undefined,
        (error) => {
          console.warn(`Could not load 3D model ${url}, using fallback geometry`, error);
          const fallback = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 1.2, 1.2),
            new THREE.MeshStandardMaterial({ color: "#00f0ff", roughness: 0.4 })
          );
          fallback.castShadow = true;
          resolve(fallback);
        }
      );
    });
  }

  async updateBuildingOnPlot(plotId, buildingData) {
    // Remove existing building mesh if present
    if (this.buildingMeshes.has(plotId)) {
      const oldGroup = this.buildingMeshes.get(plotId);
      this.scene.remove(oldGroup);
      this.buildingMeshes.delete(plotId);
    }

    if (!buildingData) return;

    const def = BUILDINGS[buildingData.type];
    if (!def) return;

    const plotObj = this.plotMeshes.get(plotId);
    if (!plotObj) return;

    const modelPath = `./reference/assets/${def.model}`;
    const model = await this.loadModel(modelPath);

    const bGroup = new THREE.Group();
    bGroup.position.copy(plotObj.group.position);
    bGroup.position.y = 0.08;

    const scale = def.scale || [1, 1, 1];
    model.scale.set(scale[0], scale[1], scale[2]);
    bGroup.add(model);

    // Pop-in bouncy scale animation
    bGroup.scale.set(0.1, 0.1, 0.1);
    let scaleProg = 0.1;
    const animatePop = () => {
      scaleProg += (1.0 - scaleProg) * 0.25;
      bGroup.scale.set(scaleProg, scaleProg, scaleProg);
      if (Math.abs(1.0 - scaleProg) > 0.01) {
        requestAnimationFrame(animatePop);
      } else {
        bGroup.scale.set(1, 1, 1);
      }
    };
    animatePop();

    // Level indicator ring if upgraded
    if (buildingData.level > 1) {
      const auraGeo = new THREE.RingGeometry(1.1, 1.3, 16);
      const auraMat = new THREE.MeshBasicMaterial({
        color: buildingData.level === 3 ? "#ffd700" : "#00ffcc",
        side: THREE.DoubleSide
      });
      const aura = new THREE.Mesh(auraGeo, auraMat);
      aura.rotation.x = -Math.PI / 2;
      aura.position.y = 0.02;
      bGroup.add(aura);
    }

    this.scene.add(bGroup);
    this.buildingMeshes.set(plotId, bGroup);
  }

  spawnTrash(x, z) {
    const trashGeo = new THREE.DodecahedronGeometry(0.35);
    const trashMat = new THREE.MeshStandardMaterial({
      color: "#ff3366",
      roughness: 0.3,
      emissive: "#66001a"
    });
    const trash = new THREE.Mesh(trashGeo, trashMat);
    trash.position.set(x, 0.3, z);
    trash.castShadow = true;
    trash.userData = { isTrash: true };
    this.scene.add(trash);
    this.trashMeshes.push(trash);
  }

  addFloatingText(text, x, y, z, color = "#00f0ff") {
    const el = document.createElement("div");
    el.className = "floating-number";
    el.textContent = text;
    el.style.color = color;
    document.body.appendChild(el);

    this.floatingTexts.push({
      el,
      pos: new THREE.Vector3(x, y + 1.2, z),
      life: 1.0
    });
  }

  setupInteraction() {
    const onPointerDown = (event) => {
      const rect = this.renderer.domElement.getBoundingClientRect();
      const clientX = event.clientX || (event.touches && event.touches[0]?.clientX);
      const clientY = event.clientY || (event.touches && event.touches[0]?.clientY);
      if (clientX === undefined || clientY === undefined) return;

      this.pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      this.pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      this.raycaster.setFromCamera(this.pointer, this.camera);
      const intersects = this.raycaster.intersectObjects(this.scene.children, true);

      for (const hit of intersects) {
        // Check trash tap
        if (hit.object.userData?.isTrash) {
          const idx = this.trashMeshes.indexOf(hit.object);
          if (idx !== -1) {
            this.scene.remove(hit.object);
            this.trashMeshes.splice(idx, 1);
            this.addFloatingText("+50 DB (Eco Boost!)", hit.point.x, hit.point.y, hit.point.z, "#10b981");
            if (this.onTrashCleaned) this.onTrashCleaned();
            return;
          }
        }

        // Check plot tap
        let cur = hit.object;
        while (cur && cur !== this.scene) {
          if (cur.userData?.isPlot) {
            this.selectPlot(cur.userData.plotId);
            if (this.onPlotSelected) this.onPlotSelected(cur.userData.plotId);
            return;
          }
          cur = cur.parent;
        }
      }
    };

    this.renderer.domElement.addEventListener("pointerdown", onPointerDown);
  }

  onResize() {
    this.width = this.container.clientWidth || 390;
    this.height = this.container.clientHeight || 500;
    this.camera.aspect = this.width / this.height;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(this.width, this.height);
  }

  render(time, isSurge = false) {
    // Gentle ocean wave motion
    if (this.ocean) {
      this.ocean.position.y = -0.6 + Math.sin(time * 1.5) * 0.05;
    }

    // Surge lighting pulse
    if (isSurge) {
      const pulse = 0.5 + 0.5 * Math.sin(time * 8);
      this.scene.background.setRGB(0.2 + pulse * 0.3, 0.1, 0.35);
      this.sunLight.color.setRGB(1.0, 0.4 + pulse * 0.3, 0.4);
    } else {
      this.scene.background.set("#4ac6ff");
      this.sunLight.color.set("#fff5db");
    }

    // Rotate trash items gently
    for (const trash of this.trashMeshes) {
      trash.rotation.y += 0.02;
      trash.rotation.x += 0.01;
    }

    // Update floating HTML numbers
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const item = this.floatingTexts[i];
      item.life -= 0.025;
      item.pos.y += 0.03;

      const screenPos = item.pos.clone().project(this.camera);
      const x = (screenPos.x * 0.5 + 0.5) * this.width;
      const y = (-(screenPos.y * 0.5) + 0.5) * this.height;

      item.el.style.transform = `translate(${x}px, ${y}px)`;
      item.el.style.opacity = item.life;

      if (item.life <= 0) {
        item.el.remove();
        this.floatingTexts.splice(i, 1);
      }
    }

    this.renderer.render(this.scene, this.camera);
  }
}


// --- TOURISTS MANAGER ---

class TouristManager {
  constructor(beachScene) {
    this.beachScene = beachScene;
    this.tourists = [];
    this.alienColors = ["#39ff14", "#00f0ff", "#ff007a", "#ffff00", "#bf55ec", "#ff7700"];
  }

  syncCount(targetCount, activePlots) {
    // Add tourists if below target
    while (this.tourists.length < targetCount && this.tourists.length < 20) {
      this.spawnTourist(activePlots);
    }
    // Remove if above target
    while (this.tourists.length > targetCount && this.tourists.length > 0) {
      const removed = this.tourists.pop();
      this.beachScene.scene.remove(removed.mesh);
    }
  }

  spawnTourist(activePlots) {
    const group = new THREE.Group();

    // Stylized low-poly alien visitor
    const color = this.alienColors[Math.floor(Math.random() * this.alienColors.length)];
    const bodyMat = new THREE.MeshStandardMaterial({
      color,
      roughness: 0.3,
      metalness: 0.1
    });

    // Torso
    const bodyGeo = new THREE.CapsuleGeometry(0.22, 0.45, 4, 8);
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.45;
    body.castShadow = true;
    group.add(body);

    // Alien Head (larger cute proportions)
    const headGeo = new THREE.SphereGeometry(0.26, 8, 8);
    const head = new THREE.Mesh(headGeo, bodyMat);
    head.position.y = 0.82;
    head.scale.set(1.1, 1.2, 1.0);
    head.castShadow = true;
    group.add(head);

    // Big black eyes
    const eyeMat = new THREE.MeshBasicMaterial({ color: "#111118" });
    const eyeGeo = new THREE.SphereGeometry(0.07, 6, 6);
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.1, 0.86, 0.22);
    leftEye.scale.set(1, 1.4, 0.6);
    const rightEye = leftEye.clone();
    rightEye.position.x = 0.1;
    group.add(leftEye);
    group.add(rightEye);

    // Initial position on the beach shore
    const startX = (Math.random() - 0.5) * 12;
    const startZ = 1.0 + Math.random() * 3.5;
    group.position.set(startX, 0.05, startZ);

    this.beachScene.scene.add(group);

    const tourist = {
      mesh: group,
      speed: 0.8 + Math.random() * 0.6,
      targetPos: this.pickTargetPosition(activePlots),
      waitTime: Math.random() * 2,
      bobOffset: Math.random() * Math.PI * 2,
      emojiLife: 0,
      emojiEl: null
    };

    this.tourists.push(tourist);
  }

  pickTargetPosition(activePlots) {
    // 60% chance to target an active attraction, 40% to wander the beach
    const attractionPlots = activePlots ? activePlots.filter(p => p.building && p.building.type !== "cyber_palm" && p.building.type !== "algae_scrubber") : [];
    if (attractionPlots.length > 0 && Math.random() < 0.65) {
      const chosen = attractionPlots[Math.floor(Math.random() * attractionPlots.length)];
      return new THREE.Vector3(chosen.x + (Math.random() - 0.5) * 1.0, 0.05, chosen.z + 0.8);
    }
    // Random beach coordinate
    return new THREE.Vector3((Math.random() - 0.5) * 12, 0.05, 0.5 + Math.random() * 3.8);
  }

  update(deltaSeconds, activePlots, powerSatisfaction) {
    for (const t of this.tourists) {
      if (t.waitTime > 0) {
        t.waitTime -= deltaSeconds;
        // Bobbing while standing
        t.mesh.position.y = 0.05 + Math.sin(performance.now() * 0.006 + t.bobOffset) * 0.04;
        continue;
      }

      // Move toward target
      const dir = new THREE.Vector3().subVectors(t.targetPos, t.mesh.position);
      dir.y = 0;
      const dist = dir.length();

      if (dist < 0.25) {
        // Reached destination, hang out and react
        t.waitTime = 2.0 + Math.random() * 3.0;
        t.targetPos = this.pickTargetPosition(activePlots);

        // Emoji reaction
        if (Math.random() < 0.5) {
          const emoji = powerSatisfaction < 0.6 ? "⚡" : Math.random() < 0.4 ? "🍹" : Math.random() < 0.7 ? "💖" : "🍜";
          this.beachScene.addFloatingText(emoji, t.mesh.position.x, 1.2, t.mesh.position.z, "#ffffff");
        }
      } else {
        dir.normalize();
        t.mesh.position.addScaledVector(dir, t.speed * deltaSeconds);
        // Look in direction of travel
        t.mesh.rotation.y = Math.atan2(dir.x, dir.z);
        // Walking hop
        t.mesh.position.y = 0.05 + Math.abs(Math.sin(performance.now() * 0.012 + t.bobOffset)) * 0.08;
      }
    }
  }

  clear() {
    for (const t of this.tourists) {
      this.beachScene.scene.remove(t.mesh);
    }
    this.tourists = [];
  }
}

          <span class="val" data-rating>2.5</span>

          <div class="badge-header">
            <span class="icon">⚡</span>
            <span class="val" data-power>0 / 0 kW</span>
          </div>
          <div class="hud-bar"><div class="bar-fill" data-power-fill style="width: 100%;"></div></div>
        </div>

        <div class="metric-badge eco-badge" data-eco-badge>

      </div>

      <div class="hud-row bottom-metrics">
        <div class="credit-counter">
          <span class="credit-icon">💾</span>
          <span class="credit-val" data-credits>2,500</span>
          <span class="credit-rate" data-rate>+0/s</span>
        </div>

        <div class="phase-badge" data-phase-badge>
          <span class="phase-icon">⏱️</span>
          <span class="phase-name" data-phase>Sunrise</span>
        </div>
      </div>

      <div class="surge-warning-banner" data-surge-banner style="display: none;">
        ⚠️ SIGNAL SURGE ACTIVE! High Power Demand!
      </div>
    `;

    container.appendChild(this.el);

    this.ratingEl = this.el.querySelector("[data-rating]");
    this.powerEl = this.el.querySelector("[data-power]");
    this.powerFill = this.el.querySelector("[data-power-fill]");
    this.powerBadge = this.el.querySelector("[data-power-badge]");
    this.ecoEl = this.el.querySelector("[data-eco]");
    this.ecoFill = this.el.querySelector("[data-eco-fill]");
    this.ecoBadge = this.el.querySelector("[data-eco-badge]");
    this.creditsEl = this.el.querySelector("[data-credits]");
    this.rateEl = this.el.querySelector("[data-rate]");
    this.phaseEl = this.el.querySelector("[data-phase]");
    this.surgeBanner = this.el.querySelector("[data-surge-banner]");
    this.muteBtn = this.el.querySelector("[data-mute-btn]");

    this.muteBtn.addEventListener("click", () => {
      if (this.onMuteToggle) {
        const isMuted = this.onMuteToggle();
        this.muteBtn.textContent = isMuted ? "🔇" : "🔊";
      }
    });
  }

  update(state) {
    this.ratingEl.textContent = state.resortRating.toFixed(1);

    this.powerEl.textContent = `${state.powerDraw} / ${state.powerGen} kW`;
    const pSat = state.powerSatisfaction;
    this.powerFill.style.width = `${Math.min(100, Math.round(pSat * 100))}%`;

    if (pSat < 0.5) {
      this.powerBadge.classList.add("danger");
      this.powerBadge.classList.remove("warning");
    } else if (pSat < 1.0) {
      this.powerBadge.classList.add("warning");
      this.powerBadge.classList.remove("danger");
    } else {
      this.powerBadge.classList.remove("warning", "danger");
    }

    const eco = Math.round(state.ecoHealth);
    this.ecoEl.textContent = `${eco}%`;
    this.ecoFill.style.width = `${eco}%`;
    if (eco < 30) {
      this.ecoBadge.classList.add("danger");
    } else {
      this.ecoBadge.classList.remove("danger");
    }

    this.creditsEl.textContent = Math.round(state.databloons).toLocaleString();
    this.rateEl.textContent = `+${state.incomeRate || 0}/s`;

    this.phaseEl.textContent = state.phaseName;

    if (state.surge.active) {
      this.surgeBanner.style.display = "block";
      this.surgeBanner.textContent = `⚠️ SIGNAL SURGE: ${Math.ceil(state.surge.remaining)}s (Grid Strained!)`;
    } else if (state.surge.countdown <= 15) {
      this.surgeBanner.style.display = "block";
      this.surgeBanner.textContent = `⚡ SURGE INCOMING: ${Math.ceil(state.surge.countdown)}s! Check Power!`;
    } else {
      this.surgeBanner.style.display = "none";
    }
  }
}


// --- UI DRAWER ---

class GameDrawer {
  constructor(container, onBuildClicked, onUpgradeClicked, onDemolishClicked, onDeselectPlot) {
    this.container = container;
    this.onBuildClicked = onBuildClicked;
    this.onUpgradeClicked = onUpgradeClicked;
    this.onDemolishClicked = onDemolishClicked;
    this.onDeselectPlot = onDeselectPlot;

    this.activeTab = "attraction"; // "attraction" | "energy" | "eco"
    this.selectedPlotId = null;

    this.el = document.createElement("section");
    this.el.id = "game-drawer";
    this.el.innerHTML = `
      <div class="plot-inspector" data-plot-inspector style="display: none;">
        <div class="inspector-header">
          <span class="inspector-title" data-plot-title>Plot #0</span>
          <button class="close-inspector-btn" data-close-inspector>✕</button>
        </div>
        <div class="inspector-content" data-plot-content></div>
        <div class="inspector-actions" data-plot-actions></div>
      </div>

      <nav class="drawer-tabs">
        <button class="tab-btn active" data-tab="attraction">🏪 Attractions</button>
        <button class="tab-btn" data-tab="energy">⚡ Energy</button>
        <button class="tab-btn" data-tab="eco">🌿 Eco & Island</button>
      </nav>

      <div class="drawer-cards-scroll" data-cards-container></div>
    `;

    container.appendChild(this.el);

    this.tabs = this.el.querySelectorAll("[data-tab]");
    this.cardsContainer = this.el.querySelector("[data-cards-container]");
    this.plotInspector = this.el.querySelector("[data-plot-inspector]");
    this.plotTitle = this.el.querySelector("[data-plot-title]");
    this.plotContent = this.el.querySelector("[data-plot-content]");
    this.plotActions = this.el.querySelector("[data-plot-actions]");
    this.closeInspectorBtn = this.el.querySelector("[data-close-inspector]");

    this.tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        this.tabs.forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        this.activeTab = tab.dataset.tab;
        this.renderCatalog();
      });
    });

    this.closeInspectorBtn.addEventListener("click", () => {
      this.selectedPlotId = null;
      this.plotInspector.style.display = "none";
      if (this.onDeselectPlot) this.onDeselectPlot();
    });

    this.renderCatalog();
  }

  setSelectedPlot(plotId, plotData, state) {
    this.selectedPlotId = plotId;
    if (plotId === null) {
      this.plotInspector.style.display = "none";
      this.lastInspectorKey = null;
      return;
    }

    const b = plotData.building;
    const def = b ? BUILDINGS[b.type] : null;
    const nextTier = b ? UPGRADE_TIERS[b.level] : null;
    const cost = nextTier ? Math.round(def.baseCost * nextTier.costFactor) : 0;
    const canAfford = nextTier && state ? state.databloons >= cost : false;
    const currentKey = `${plotId}_${b ? `${b.type}_${b.level}_${canAfford}` : "empty"}`;

    if (this.lastInspectorKey === currentKey) {
      return;
    }
    this.lastInspectorKey = currentKey;

    this.plotInspector.style.display = "block";
    this.plotTitle.textContent = `Plot #${plotId + 1} (${plotData.type.toUpperCase()})`;

    if (!plotData.building) {
      this.plotContent.innerHTML = `
        <p class="empty-plot-hint">Plot is empty. Tap any building below to build here!</p>
      `;
      this.plotActions.innerHTML = "";
    } else {
      const tier = UPGRADE_TIERS[plotData.building.level - 1] || UPGRADE_TIERS[0];
      const refund = Math.round(def.baseCost * 0.4);

      let statInfo = "";
      if (def.category === "energy") {
        statInfo = `<span class="stat-power-gen">+${Math.round(def.powerGen * tier.multiplier)} kW Power</span>`;
      } else if (def.category === "attraction") {
        statInfo = `<span class="stat-revenue">+${Math.round(def.baseRevenue * tier.multiplier)} DB/s</span> • <span class="stat-power-draw">-${def.powerDraw} kW</span>`;
      } else {
        statInfo = `<span class="stat-eco">+${Math.round(def.ecoImpact * tier.multiplier)}% Eco Health</span>`;
      }

      this.plotContent.innerHTML = `
        <div class="building-details">
          <span class="b-icon">${def.icon}</span>
          <div class="b-meta">
            <strong>${def.name} <span class="level-tag">Lv.${plotData.building.level} (${tier.name})</span></strong>
            <div class="b-stats">${statInfo}</div>
          </div>
        </div>
      `;

      this.plotActions.innerHTML = `
        ${
          nextTier
            ? `<button class="action-btn upgrade-btn ${canAfford ? "" : "disabled"}" data-upgrade-btn>
                ⏫ Upgrade to Lv.${plotData.building.level + 1} (${cost.toLocaleString()} DB)
              </button>`
            : `<div class="max-level-badge">⭐ Maximum Level Reached</div>`
        }
        <button class="action-btn demolish-btn" data-demolish-btn>
          🗑️ Demolish (+${refund.toLocaleString()} DB)
        </button>
      `;

      const upBtn = this.plotActions.querySelector("[data-upgrade-btn]");
      if (upBtn && canAfford) {
        upBtn.addEventListener("click", () => {
          if (this.onUpgradeClicked) this.onUpgradeClicked(plotId);
        });
      }

      const demBtn = this.plotActions.querySelector("[data-demolish-btn]");
      if (demBtn) {
        demBtn.addEventListener("click", () => {
          if (this.onDemolishClicked) this.onDemolishClicked(plotId);
        });
      }
    }
  }

  renderCatalog(state) {
    this.cardsContainer.innerHTML = "";
    const items = Object.values(BUILDINGS).filter((b) => b.category === this.activeTab);

    items.forEach((item) => {
      const card = document.createElement("div");
      card.className = "building-card";
      const canAfford = state ? state.databloons >= item.baseCost : true;
      if (!canAfford) card.classList.add("disabled");

      let impactHtml = "";
      if (item.category === "energy") {
        impactHtml = `<span class="tag power">+${item.powerGen} kW</span>`;
      } else if (item.category === "attraction") {
        impactHtml = `<span class="tag revenue">+${item.baseRevenue}/s</span> <span class="tag draw">-${item.powerDraw}kW</span>`;
      } else {
        impactHtml = `<span class="tag eco">+${item.ecoImpact}% Eco</span>`;
      }

      card.innerHTML = `
        <div class="card-icon">${item.icon}</div>
        <div class="card-info">
          <div class="card-title">${item.name}</div>
          <div class="card-tags">${impactHtml}</div>
          <div class="card-cost">💾 ${item.baseCost.toLocaleString()} DB</div>
        </div>
        <button class="build-action-btn ${canAfford ? "" : "disabled"}">BUILD</button>
      `;

      card.addEventListener("click", () => {
        if (canAfford && this.onBuildClicked) {
          this.onBuildClicked(item.id, this.selectedPlotId);
        }
      });

      this.cardsContainer.appendChild(card);
    });
  }

  update(state, plots) {
    if (this.selectedPlotId !== null && plots[this.selectedPlotId]) {
      this.setSelectedPlot(this.selectedPlotId, plots[this.selectedPlotId], state);
    }
    // Efficiently update disabled/affordability state without re-creating DOM
    const items = Object.values(BUILDINGS).filter((b) => b.category === this.activeTab);
    const cardNodes = this.cardsContainer.querySelectorAll(".building-card");
    items.forEach((item, idx) => {
      const card = cardNodes[idx];
      if (!card) return;
      const canAfford = state ? state.databloons >= item.baseCost : true;
      const btn = card.querySelector(".build-action-btn");
      if (canAfford) {
        card.classList.remove("disabled");
        if (btn) btn.classList.remove("disabled");
      } else {
        card.classList.add("disabled");
        if (btn) btn.classList.add("disabled");
      }
    });
  }
}

    this.modalIcon.textContent = "🏆";
    this.modalTitle.textContent = "5-STAR RESORT ACHIEVED!";
    this.modalDesc.textContent = "Congratulations! Data B-each is the highest-rated alien eco-resort in the quadrant!";

    this.modalStats.innerHTML = `
      <div class="stat-row"><span>Total Earned:</span> <strong>💾 ${Math.round(state.lifetimeEarned).toLocaleString()} DB</strong></div>
      <div class="stat-row"><span>Final Rating:</span> <strong>⭐ ${state.resortRating.toFixed(1)} / 5.0</strong></div>
      <div class="stat-row"><span>Eco Health:</span> <strong>🌿 ${Math.round(state.ecoHealth)}%</strong></div>
      <div class="stat-row"><span>Surges Survived:</span> <strong>⚡ ${state.stats.surgesSurvived}</strong></div>
      <div class="stat-row"><span>Buildings Placed:</span> <strong>🏗️ ${state.stats.buildingsPlaced}</strong></div>
    `;
    this.modalBtn.textContent = "PLAY AGAIN";
    this.overlay.style.display = "flex";
  }

  showGameOver(state) {
    this.modalCard.className = "modal-card defeat";
    this.modalIcon.textContent = "⚠️";
    this.modalTitle.textContent = "RESORT EVACUATED";
    this.modalDesc.textContent = state.statusMessage || "The resort collapsed due to system failure.";

    this.modalStats.innerHTML = `
      <div class="stat-row"><span>Survival Time:</span> <strong>⏱️ ${Math.floor(state.gameTime / 60)}m ${Math.floor(state.gameTime % 60)}s</strong></div>
      <div class="stat-row"><span>Total Revenue:</span> <strong>💾 ${Math.round(state.lifetimeEarned).toLocaleString()} DB</strong></div>
      <div class="stat-row"><span>Tip for Next Run:</span> <em>Ensure you build Solar & Turbines before high-demand shops!</em></div>
    `;
    this.modalBtn.textContent = "TRY AGAIN";
    this.overlay.style.display = "flex";
  }

  hide() {
    this.overlay.style.display = "none";
  }
}


// --- MAIN GAME COORDINATOR ---








class DataBeachGame {
  constructor(rootContainer) {
    this.root = rootContainer;
    this.state = createInitialState();
    this.economy = new EconomyEngine(this.state);
    this.sound = new SoundFX();

    this.root.innerHTML = `
      <div id="app-container">
        <div id="viewport-container"></div>
      </div>
    `;

    this.appContainer = this.root.querySelector("#app-container");
    this.viewportContainer = this.root.querySelector("#viewport-container");

    // 1. Scene
    this.scene = new BeachScene(
      this.viewportContainer,
      (plotId) => this.onPlotSelected(plotId),
      () => this.onTrashCleaned()
    );
    this.scene.setupPlots(this.state.plots);

    // 2. Tourists
    this.tourists = new TouristManager(this.scene);

    // 3. UI
    this.hud = new GameHUD(this.appContainer, () => this.sound.toggleMute());
    this.drawer = new GameDrawer(
      this.appContainer,
      (type, plotId) => this.onBuild(type, plotId),
      (plotId) => this.onUpgrade(plotId),
      (plotId) => this.onDemolish(plotId),
      () => this.onDeselectPlot()
    );
    this.modals = new GameModals(this.appContainer, () => this.restart());

    this.lastTime = performance.now();
    this.trashSpawnTimer = 0;
    this.isRunning = true;

    // First user gesture initializes WebAudio
    window.addEventListener("pointerdown", () => this.sound.ensureContext(), { once: true });

    // Initial plots
    this.drawer.update(this.state, this.state.plots);

    // Start loop
    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }

  onPlotSelected(plotId) {
    this.sound.playClick();
    this.drawer.setSelectedPlot(plotId, this.state.plots[plotId], this.state);
  }

  onDeselectPlot() {
    this.scene.selectPlot(null);
  }

  onBuild(buildingType, selectedPlotId) {
    // If no plot selected, pick the first available plot that suits the category
    let targetId = selectedPlotId;
    if (targetId === null || this.state.plots[targetId].building) {
      const freePlot = this.state.plots.find((p) => !p.building);
      if (freePlot) targetId = freePlot.id;
    }

    if (targetId === null || targetId === undefined) {
      this.scene.addFloatingText("No Free Plots Available!", 0, 1, 0, "#ef4444");
      return;
    }

    if (this.economy.build(buildingType, targetId)) {
      this.sound.playBuild();
      this.scene.updateBuildingOnPlot(targetId, this.state.plots[targetId].building);
      this.scene.selectPlot(targetId);
      this.drawer.setSelectedPlot(targetId, this.state.plots[targetId], this.state);
      this.drawer.update(this.state, this.state.plots);

      const plotPos = this.state.plots[targetId];
      this.scene.addFloatingText("Built!", plotPos.x, 1.5, plotPos.z, "#00f0ff");
    } else {
      this.scene.addFloatingText("Not Enough Databloons!", 0, 1, 0, "#ef4444");
    }
  }

  onUpgrade(plotId) {
    if (this.economy.upgrade(plotId)) {
      this.sound.playUpgrade();
      this.scene.updateBuildingOnPlot(plotId, this.state.plots[plotId].building);
      this.drawer.setSelectedPlot(plotId, this.state.plots[plotId], this.state);
      this.drawer.update(this.state, this.state.plots);

      const plotPos = this.state.plots[plotId];
      this.scene.addFloatingText("UPGRADED! ⭐", plotPos.x, 2.0, plotPos.z, "#ffd700");
    }
  }

  onDemolish(plotId) {
    this.sound.playClick();
    this.economy.demolish(plotId);
    this.scene.updateBuildingOnPlot(plotId, null);
    this.drawer.setSelectedPlot(plotId, this.state.plots[plotId], this.state);
    this.drawer.update(this.state, this.state.plots);
  }

  onTrashCleaned() {
    this.sound.playTrashClean();
    this.economy.cleanTrash();
    this.drawer.update(this.state, this.state.plots);
  }

  restart() {
    this.state = createInitialState();
    this.economy = new EconomyEngine(this.state);

    // Clear meshes
    this.state.plots.forEach((p) => {
      this.scene.updateBuildingOnPlot(p.id, null);
    });
    this.scene.trashMeshes.forEach((t) => this.scene.scene.remove(t));
    this.scene.trashMeshes = [];
    this.tourists.clear();

    this.scene.selectPlot(null);
    this.drawer.setSelectedPlot(null, null, this.state);
    this.drawer.update(this.state, this.state.plots);
    this.modals.hide();
    this.lastTime = performance.now();
  }

  loop(now) {
    if (!this.isRunning) return;

    const delta = Math.min((now - this.lastTime) / 1000, 0.1);
    this.lastTime = now;

    if (this.state.status === "playing") {
      const prevSurge = this.state.surge.active;

      // 1. Tick simulation economy
      this.economy.tick(delta);

      // 2. Play warning sound when surge begins
      if (!prevSurge && this.state.surge.active) {
        this.sound.playSurgeWarning();
      }

      // 3. Periodic trash spawning (especially when tourists are high)
      this.trashSpawnTimer += delta;
      if (this.trashSpawnTimer > 18 && this.scene.trashMeshes.length < 4) {
        this.trashSpawnTimer = 0;
        const tx = (Math.random() - 0.5) * 11;
        const tz = 0.5 + Math.random() * 3.5;
        this.scene.spawnTrash(tx, tz);
      }

      // 4. Update tourists
      this.tourists.syncCount(this.state.touristCount, this.state.plots);
      this.tourists.update(delta, this.state.plots, this.state.powerSatisfaction);

      // 5. Update UI
      this.hud.update(this.state);
      this.drawer.update(this.state, this.state.plots);

      // 6. Handle victory/defeat
      if (this.state.status === "victory") {
        this.sound.playVictory();
        this.modals.showVictory(this.state);
      } else if (this.state.status === "game_over") {
        this.sound.playGameOver();
        this.modals.showGameOver(this.state);
      }
    }

    // Render 3D Scene
    this.scene.render(now * 0.001, this.state.surge.active);

    requestAnimationFrame(this.loop);
  }
}


// Boot the game when DOM is ready
window.addEventListener("DOMContentLoaded", () => {
  const root = document.getElementById("app");
  window.game = new DataBeachGame(root);
});

    </script>
